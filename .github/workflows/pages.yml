# Builds the replay viewer (viewer/ plus the three scenes from tools/viewer_data.py)
# and publishes it to GitHub Pages. Needs Settings -> Pages -> Source: "GitHub Actions".
name: replay viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build the replay site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev nlohmann-json3-dev ninja-build

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKYTRACK_BUILD_TESTS=OFF
          cmake --build build

      - name: Run the scenes and export them
        run: python3 tools/viewer_data.py --out site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: publish to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
